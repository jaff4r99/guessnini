<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guess Who: Friends Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6EFE4;--ink:#2A2233;--mut:#6F6578;--card:#FFFFFF;--line:#E4D9C8;--p1:#D9433B;--p1d:#A92E28;--p2:#2F6DB5;--p2d:#21508A;--yel:#FFC93C;--good:#2E9A5E;--bad:#C8402F;--shadow:0 6px 18px rgba(60,40,20,.12);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1D1924;--ink:#F4EEE6;--mut:#B3A9BE;--card:#2A2433;--line:#3D3548;--shadow:0 6px 18px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1D1924;--ink:#F4EEE6;--mut:#B3A9BE;--card:#2A2433;--line:#3D3548;--shadow:0 6px 18px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Fredoka,'Trebuchet MS',system-ui,sans-serif;font-size:16px}
button{font:inherit;cursor:pointer;color:inherit}button:disabled{cursor:default;opacity:.5}
:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
.btn{border:0;border-radius:12px;padding:10px 18px;font-weight:600;background:var(--yel);color:#2A2233;box-shadow:0 3px 0 #C99512}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #C99512}
.btn.p1{background:var(--p1);color:#fff;box-shadow:0 3px 0 var(--p1d)}.btn.p2{background:var(--p2);color:#fff;box-shadow:0 3px 0 var(--p2d)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);box-shadow:none;color:var(--ink)}
.btn.good{background:var(--good);color:#fff;box-shadow:0 3px 0 #1F7043}.btn.bad{background:var(--bad);color:#fff;box-shadow:0 3px 0 #8E2C20}
input[type=text]{font:inherit;font-size:17px;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);width:100%}
input[type=text]:focus{outline:none;border-color:var(--yel)}
/* home */
#home{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.homecard{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:26px;max-width:560px;width:100%}
.logo{font-size:clamp(40px,9vw,64px);font-weight:700;line-height:.95;letter-spacing:-.01em}.logo b{color:var(--p1)}.logo i{font-style:normal;color:var(--p2)}
.sub{color:var(--mut);margin:8px 0 18px}
.strip{display:flex;gap:6px;margin:0 0 20px;overflow:hidden;border-radius:14px}.strip svg{width:58px;flex:none;border-radius:10px}
.hrow{display:flex;gap:8px;margin-top:10px}.hrow input{flex:1}
label.l{font-weight:600;display:block;margin:14px 0 6px}
#h-err{color:var(--bad);min-height:1.3em;margin-top:10px}
/* room */
#room{max-width:1400px;margin:0 auto;padding:12px 16px 24px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.top h1{font-size:24px;margin:0;flex:1;min-width:180px}.top h1 small{font-size:15px;color:var(--mut);font-weight:500;margin-left:6px}
.code{font-weight:700;letter-spacing:.12em;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:6px 12px}
.seats{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch;margin-bottom:12px}
.seat{background:var(--card);border-radius:16px;padding:10px 14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;border:3px solid transparent;min-height:66px}
.seat.s0{border-left:8px solid var(--p1)}.seat.s1{border-left:8px solid var(--p2)}
.seat.turn.s0{border-color:var(--p1)}.seat.turn.s1{border-color:var(--p2)}
.seat .nm{font-weight:700;font-size:18px}.seat .meta{color:var(--mut);font-size:14px}.seat .grow{flex:1;min-width:0}
.seat .sec{width:44px;border-radius:8px;overflow:hidden;flex:none}.seat .sec svg{display:block}
.vs{align-self:center;font-weight:700;color:var(--mut)}
.main{display:grid;grid-template-columns:1fr 340px;gap:14px;align-items:start}
.panel{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:14px}
.status{font-size:19px;font-weight:600;line-height:1.3;margin-bottom:10px}
.status .q{display:block;margin-top:6px;font-size:22px;color:var(--p2)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chip{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:5px 11px;font-size:14px}
.chip:hover{border-color:var(--yel)}
.log{max-height:300px;overflow-y:auto;display:flex;flex-direction:column;gap:5px;margin-top:12px;border-top:1.5px solid var(--line);padding-top:10px;font-size:15px}
.log div{line-height:1.3}.log .sys{color:var(--mut);font-style:italic}.log .q{font-weight:600}.log .a.yes{color:var(--good);font-weight:700}.log .a.no{color:var(--bad);font-weight:700}.log .a.maybe{color:var(--mut);font-weight:700}
.log b.c0{color:var(--p1)}.log b.c1{color:var(--p2)}.log .gw{font-weight:700}
.chatrow{display:flex;gap:6px;margin-top:10px}.chatrow input{font-size:15px;padding:8px 10px}
.reacts{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}.reacts button{border:0;background:transparent;font-size:22px;padding:2px 4px;border-radius:8px}.reacts button:hover{background:var(--line)}
.who{font-size:14px;color:var(--mut);margin-top:10px}
/* boards */
.boards{display:grid;gap:14px}.boards.two{grid-template-columns:1fr 1fr}
.bwrap{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:12px;border-top:8px solid var(--line)}
.bwrap.b0{border-top-color:var(--p1)}.bwrap.b1{border-top-color:var(--p2)}
.bhead{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-weight:600}.bhead .grow{flex:1}.bhead .cnt{color:var(--mut);font-weight:500}
.mine{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:12px;padding:4px 10px 4px 4px;font-size:14px}.mine svg{width:40px;border-radius:8px;display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.boards.two .grid{grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:5px}
.card{border:0;padding:0;background:transparent;perspective:600px;aspect-ratio:100/138;position:relative;display:block;width:100%}
.card .in{position:absolute;inset:0;transition:transform .45s cubic-bezier(.4,1.4,.6,1);transform-style:preserve-3d;transform-origin:50% 50%}
.card .fr,.card .bk{position:absolute;inset:0;backface-visibility:hidden;border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.card .fr{background:var(--card);border:2px solid var(--line)}.card .fr svg{display:block;width:100%;flex:none}
.card .fr span{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:600;font-size:13px;line-height:1.05;padding:1px 3px}
.boards.two .card .fr span{font-size:10.5px}
.card:disabled{opacity:1}
.card .bk{transform:rotateX(180deg);align-items:center;justify-content:center;color:rgba(255,255,255,.85);font-weight:700;font-size:12px;text-align:center;padding:2px;background:repeating-linear-gradient(45deg,var(--p1) 0 8px,var(--p1d) 8px 16px);border:2px solid var(--p1d)}
.b1 .card .bk{background:repeating-linear-gradient(45deg,var(--p2) 0 8px,var(--p2d) 8px 16px);border-color:var(--p2d)}
.card.down .in{transform:rotateX(180deg)}
.card.secret .fr{border-color:var(--yel);box-shadow:0 0 0 3px var(--yel)}
.card.picked .fr{border-color:var(--good);box-shadow:0 0 0 3px var(--good)}
.guessing .card:not(.down) .fr{animation:wig 1s ease-in-out infinite}@keyframes wig{50%{transform:rotate(-1.5deg)}}
.grid.ro .card{cursor:default}
.card:not(:disabled):hover .fr{border-color:var(--yel)}
/* lobby notice */
.lobbybox{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:22px;text-align:center}
.lobbybox h2{margin:0 0 8px}.lobbybox p{color:var(--mut);margin:6px 0}
/* overlay */
.over{position:fixed;inset:0;background:rgba(20,15,25,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.overcard{background:var(--card);border-radius:24px;padding:24px;max-width:560px;width:100%;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.35);animation:pop .35s cubic-bezier(.3,1.5,.6,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.overcard h2{font-size:34px;margin:0 0 6px}.reveal{display:flex;justify-content:center;gap:20px;margin:16px 0}.reveal div{width:120px}.reveal svg{width:100%;border-radius:12px;display:block}.reveal small{display:block;color:var(--mut)}
.float{position:fixed;bottom:80px;font-size:34px;pointer-events:none;animation:up 2.2s ease-out forwards;z-index:30}@keyframes up{to{transform:translateY(-55vh);opacity:0}}
.conf{position:fixed;top:-20px;width:9px;height:9px;z-index:25;pointer-events:none;animation:fall linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(600deg)}}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:40;font-weight:600}
@media (max-width:980px){.main{grid-template-columns:1fr}.main aside{order:-1}.log{max-height:130px}.boards.two{grid-template-columns:1fr}}
@media (max-width:600px){.seats{grid-template-columns:1fr}.vs{display:none}.grid{grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:5px}.card .fr span{font-size:11px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<section id="home">
  <div class="homecard">
    <div class="logo"><b>Guess</b> <i>Who?</i></div>
    <div class="sub">Friends edition, with a few famous faces. Two people play, everyone else can watch.</div>
    <div class="strip" id="strip"></div>
    <label class="l" for="nm">Your name</label>
    <input type="text" id="nm" maxlength="16" autocomplete="nickname" placeholder="Type your name">
    <div class="hrow" style="margin-top:16px"><button class="btn" id="create" type="button">Create a room</button></div>
    <label class="l" for="code">Or join a room</label>
    <div class="hrow"><input type="text" id="code" maxlength="4" placeholder="CODE" autocomplete="off" style="text-transform:uppercase;letter-spacing:.2em;font-weight:700"><button class="btn ghost" id="join" type="button">Join</button></div>
    <div id="h-err" role="status"></div>
  </div>
</section>

<section id="room" hidden>
  <div class="top"><h1>Guess Who? <small id="r-count"></small></h1><span class="code" id="r-code"></span><button class="btn ghost" id="r-copy" type="button">Copy invite link</button><button class="btn ghost" id="r-leave" type="button">Leave</button></div>
  <div class="seats">
    <div class="seat s0" id="seat0"></div><div class="vs">vs</div><div class="seat s1" id="seat1"></div>
  </div>
  <div class="main">
    <div id="stage"></div>
    <aside class="panel">
      <div class="status" id="status"></div>
      <div id="controls"></div>
      <div class="log" id="log" aria-live="polite"></div>
      <div class="chatrow"><input type="text" id="chat" maxlength="120" placeholder="Say something" aria-label="Chat message"><button class="btn ghost" id="send" type="button">Send</button></div>
      <div class="reacts" id="reacts"></div>
      <div class="who" id="watchers"></div>
    </aside>
  </div>
</section>
<div id="overlay"></div>

<script>
// ================================================================ the cast and their portraits (drawn in SVG)
const PEOPLE = [
  // ---- friends and family first
  { id: 'farhan', name: 'Farhan', g: 'f', skin: '#E6B48F', hair: '#3A2A20', hs: 'perm', wear: 'shirt', top: '#F1ECE2', top2: '#D6D0C2', bg: '#FFD9A8' },
  { id: 'jaffar', name: 'Jaffar', g: 'm', skin: '#C68C64', hair: '#1F1612', hs: 'curly', wear: 'tee', top: '#B3202E', bg: '#C9E4F5' },
  { id: 'iqra', name: 'Iqra', g: 'w', skin: '#F0C4A2', hair: '#2A1C17', hs: 'long', wear: 'kurta', top: '#E46A4E', top2: '#B9493A', bg: '#FCE1E4' },
  { id: 'noor', name: 'Noor', g: 'w', skin: '#C68C64', hair: '#2E2622', hs: 'bob', streak: '#2AA6A0', glasses: '#9A6A3E', gshape: 'round', wear: 'tee', top: '#7FA3CF', bg: '#D7F0E8' },
  { id: 'alex', name: 'Alex', g: 'm', skin: '#F2CDB0', hair: '#C8662E', hs: 'short', glasses: '#5A5A64', beard: 'full', beardCol: '#B85A28', wear: 'tee', top: '#4E7A4A', bg: '#FFF0B8' },
  { id: 'amna', name: 'Amna', g: 'w', skin: '#C68C64', hs: 'hijab', hijab: '#7A5C8E', wear: 'kurta', top: '#E9DCC8', top2: '#CDBDA6', bg: '#E6DDF5' },
  { id: 'nikolai', name: 'Nikolai', g: 'm', skin: '#F1CDB4', hair: '#6B4A30', hs: 'short', beard: 'full', beardCol: '#5E3F28', wear: 'tee', top: '#3E5A7A', bg: '#DDEBD2' },
  { id: 'mobin', name: 'Mobin', g: 'm', skin: '#EBC09C', hair: '#B8622C', hs: 'curlyUp', beard: 'full', beardCol: '#B05A28', wear: 'tee', top: '#5C6B3A', bg: '#FBE3CF' },
  { id: 'musab', name: 'Musab', g: 'm', skin: '#C68C64', hair: '#1E1612', hs: 'short', glasses: '#4A4A52', beard: 'long', wear: 'kurta', top: '#E9E6DE', top2: '#CFCAC0', bg: '#D3E6F2' },
  { id: 'adeena', name: 'Adeena', g: 'w', skin: '#E7B996', hs: 'hijab', hijab: '#2F4A6E', wear: 'kurta', top: '#B8C8D8', top2: '#93A6BA', bg: '#FFE2C8' },
  { id: 'hamna', name: 'Hamna', g: 'w', skin: '#A0694A', hair: '#241A14', hs: 'long', glasses: '#8A6A52', gshape: 'rect', wear: 'kurta', top: '#D98C5F', top2: '#B56E45', bg: '#E2EEF9' },
  { id: 'tayyba', name: 'Tayyba', g: 'w', skin: '#EFC6A6', hair: '#2A1C16', hs: 'long', wear: 'dress', top: '#F4F2EE', top2: '#5E7FB5', bg: '#F9DCE8' },
  { id: 'rafay', name: 'Rafay', g: 'm', skin: '#A0694A', hair: '#1A1410', hs: 'buzz', wear: 'tee', top: '#E8823A', bg: '#D9EFE1' },
  { id: 'usama', name: 'Usama', g: 'm', skin: '#E2AF8A', hair: '#1E1612', hs: 'cap', cap: '#C8102E', glasses: '#5A5A64', gshape: 'rect', wear: 'tee', top: '#3A4A6A', bg: '#FFF2C2' },
  { id: 'ibrahim', name: 'Ibrahim', g: 'm', skin: '#EDB895', hair: '#6B4428', hs: 'wavy', wear: 'tee', top: '#26221F', bg: '#E4DEF6' },
  { id: 'izza', name: 'Izza', g: 'w', skin: '#EFC4A4', hair: '#3A2418', hs: 'ponytail', wear: 'kurta', top: '#C97FA0', top2: '#A8607F', bg: '#DCF1F3' },
  { id: 'ayesha', name: 'Ayesha', g: 'w', skin: '#E9BC98', hair: '#2A1C16', hs: 'long', wear: 'kurta', top: '#8FB37A', top2: '#6E9459', bg: '#FFE6D2' },
  { id: 'abdullah', name: 'Abdullah', g: 'm', skin: '#A0694A', hair: '#1E1612', hs: 'slick', beard: 'light', wear: 'shirt', top: '#7A8A9A', top2: '#5E6E7E', bg: '#E9F2D6' },
  { id: 'jawad', name: 'Jawad', g: 'm', skin: '#E0AC88', hair: '#1E1612', hs: 'messy', beard: 'shadow', wear: 'shirt', top: '#9A9A9A', top2: '#7C7C7C', bg: '#F6DDE2' },
  { id: 'reynier', name: 'Reynier', g: 'm', skin: '#F4D3BA', hair: '#B9A88A', hs: 'short', glasses: '#5A5A64', beard: 'light', beardCol: '#A8987A', wear: 'shirt', top: '#3E5A6E', top2: '#2E4A5E', bg: '#D9E7F7' },
  { id: 'musa', name: 'Musa', g: 'baby', skin: '#F0C3A0', hair: '#2A1C16', wear: 'onesie', top: '#8FC6E8', bg: '#FFF4CC' },
  { id: 'chomsky', name: 'Chomsky', g: 'dog', bg: '#E8F4D9' },
  // ---- famous faces
  { id: 'zardari', name: 'Asif Ali Zardari', short: 'Zardari', famous: 'President of Pakistan', g: 'm', skin: '#D9A684', hair: '#E4E1DA', hs: 'receding', moustache: true, beardCol: '#CFCBC2', lines: true, wear: 'sherwani', top: '#2B2B30', bg: '#E3EEE3' },
  { id: 'shehbaz', name: 'Shehbaz Sharif', short: 'Shehbaz', famous: 'Prime Minister of Pakistan', g: 'm', skin: '#E2B08E', hair: '#BDB8AE', hs: 'bald', lines: true, wear: 'suit', top: '#2A3346', tie: '#8A2432', bg: '#E7E2F3' },
  { id: 'imran', name: 'Imran Khan', short: 'Imran', famous: 'Former PM and cricket captain', g: 'm', skin: '#D8A482', hair: '#6E6A66', hs: 'swept', lines: true, wear: 'waistcoat', top: '#EDEBE5', top2: '#3A3A42', bg: '#FCE5CF' },
  { id: 'babar', name: 'Babar Azam', short: 'Babar', famous: 'Pakistan cricketer', g: 'm', skin: '#C68C64', hair: '#16110E', hs: 'short', beard: 'light', wear: 'kit', top: '#0F6B3A', top2: '#7FD08E', bg: '#DFF2E4' },
  { id: 'malala', name: 'Malala Yousafzai', short: 'Malala', famous: 'Nobel Peace Prize winner', g: 'w', skin: '#E2AE8A', hair: '#2A1C16', hs: 'scarf', hijab: '#C8304E', wear: 'kurta', top: '#F2E2CC', top2: '#D8C2A6', bg: '#FDE0E3' },
  { id: 'messi', name: 'Lionel Messi', short: 'Messi', famous: 'Footballer, Argentina', g: 'm', skin: '#F0C8A8', hair: '#6A4A30', hs: 'slick', beard: 'full', beardCol: '#5A3E28', wear: 'kit', top: '#FFFFFF', top2: '#75AADB', stripes: true, bg: '#DCEEFB' },
  { id: 'ronaldo', name: 'Cristiano Ronaldo', short: 'Ronaldo', famous: 'Footballer, Portugal', g: 'm', skin: '#E6B892', hair: '#1E1612', hs: 'slick', wear: 'kit', top: '#C8102E', top2: '#0B6B3A', bg: '#FFF0C8' },
  { id: 'saka', name: 'Bukayo Saka', short: 'Saka', famous: 'Footballer, Arsenal and England', g: 'm', skin: '#7A4E34', hair: '#15100D', hs: 'buzz', wear: 'kit', top: '#DB0007', top2: '#FFFFFF', sleeves: true, bg: '#FBE0E0' },
];
const PBY = Object.fromEntries(PEOPLE.map((p) => [p.id, p]));
const SHADE = (h, f) => { const n = parseInt(h.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255; const t = f < 0 ? 0 : 255, a = Math.abs(f); r = Math.round((t - r) * a + r); g = Math.round((t - g) * a + g); b = Math.round((t - b) * a + b); return '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1); };

function portrait(p) {
  if (p.g === 'dog') return dogSVG(p);
  const s = [], skin = p.skin, skinD = SHADE(skin, -0.14), hair = p.hair || '#222', hairL = SHADE(hair, 0.18), top = p.top, top2 = p.top2 || SHADE(top, -0.18);
  const baby = p.g === 'baby';
  const cx = 50, cy = baby ? 56 : 54, rx = baby ? 25 : 20.5, ry = baby ? 25 : 24.5;
  s.push(`<rect width="100" height="120" fill="${p.bg}"/>`);
  s.push(`<circle cx="50" cy="${baby ? 60 : 56}" r="44" fill="#fff" opacity=".35"/>`);
  // back hair / headscarf
  if (p.hs === 'long') s.push(`<path d="M27 50C24 30 38 22 50 22C62 22 76 30 73 50L77 98C66 102 34 102 23 98Z" fill="${hair}"/>`);
  if (p.hs === 'bob') s.push(`<path d="M27 50C24 30 38 22 50 22C62 22 76 30 73 50L75 76C68 80 32 80 25 76Z" fill="${hair}"/>`);
  if (p.hs === 'ponytail') s.push(`<path d="M66 38C86 42 88 72 76 86C74 70 72 54 64 46Z" fill="${hair}"/>`);
  if (p.hs === 'hijab' || p.hs === 'scarf') { const h = p.hijab; s.push(`<path d="M50 19C29 19 21 38 22 60C23 80 28 90 14 120L86 120C72 90 77 80 78 60C79 38 71 19 50 19Z" fill="${h}"/><path d="M22 60C23 80 28 90 14 120L30 120C34 100 30 84 28 66Z" fill="${SHADE(h, -0.15)}"/>`); if (p.hs === 'scarf') s.push(`<path d="M28 48C26 32 38 26 50 26C62 26 74 32 72 48L74 82C66 86 34 86 26 82Z" fill="${hair}"/>`); }
  // clothes
  const sh = baby ? 'M18 120C20 100 32 92 50 92C68 92 80 100 82 120Z' : 'M8 120C10 97 26 89 50 89C74 89 90 97 92 120Z';
  s.push(`<path d="${sh}" fill="${top}"/>`);

    case 'flip': if (S.phase === 'play' && seat >= 0 && PBY[m.id]) { const f = S.flips[seat], i = f.indexOf(m.id); if (i >= 0) f.splice(i, 1); else f.push(m.id); } break;
    case 'end': if (S.phase === 'play' && seat === S.turn && S.step === 'flip') { S.turn = 1 - S.turn; S.step = 'ask'; S.q = null; } break;

    case 'chat': { const t = String(m.text || '').trim().slice(0, 120); if (t) { S.log.push({ k: 'c', name: nameOf(from), s: seat, text: t }); trim(); } break; }
    case 'react': { const e = REACTS.includes(m.e) ? m.e : null; if (e) { bcast({ t: 'react', e }); floatEmoji(e); } return; }

function onGuest(m) {

  if (m.t === 'react') floatEmoji(m.e);
}

// ---------------------------------------------------------------- screen
const REACTS = ['😂', '😱', '👀', '🔥', '👏', '🤔', '🎉', '💀'];
const CHIPS = ['Do they wear glasses?', 'Do they have a beard?', 'Is it a man?', 'Is it a woman?', 'Do they wear a headscarf?', 'Is their hair curly?', 'Is their hair long?', 'Is it someone famous?', 'Do they play sport?', 'Are they a politician?', 'Are they wearing red?', 'Is their hair dark?', 'Is it a baby?', 'Do they have a moustache?'];
function show(id) { $('home').hidden = id !== 'home'; $('room').hidden = id !== 'room'; if (id === 'home') { $('overlay').innerHTML = ''; } }
let boardsBuilt = '', lastLog = -1, lastOver = '';
function render() {
  if (!S) return;

  $('r-code').textContent = 'Code ' + S.code; $('r-count').textContent = S.people.length + (S.people.length === 1 ? ' person here' : ' people here');
  // seats

    el.classList.toggle('turn', turn);
    const secret = (playing || S.phase === 'over') && S.secrets[i] && (watching || S.phase === 'over' || i === mySeat) ? '<div class="sec" title="Secret person">' + SVG[S.secrets[i]] + '</div>' : '';
    if (!pid) { el.innerHTML = '<div class="grow"><div class="nm">Player ' + (i + 1) + '</div><div class="meta">Empty seat</div></div>' + (mySeat < 0 && !playing ? '<button class="btn ' + (i ? 'p2' : 'p1') + '" data-sit="' + i + '" type="button">Play here</button>' : ''); }

      el.innerHTML = secret + '<div class="grow"><div class="nm">' + esc(nameOf(pid)) + (pid === ME.id ? ' (you)' : '') + '</div><div class="meta">Player ' + (i + 1) + ' · ' + S.score[i] + (S.score[i] === 1 ? ' win' : ' wins') + (playing ? ' · ' + left + ' left standing' : '') + (turn ? ' · <b>their turn</b>' : '') + '</div></div>' + (pid === ME.id && !playing ? '<button class="btn ghost" data-stand type="button">Watch instead</button>' : ''); }
  });

  } else {
    const key = S.phase + ':' + (watching ? 'w' : 'p' + mySeat) + ':' + S.secrets.join(',');
    if (boardsBuilt !== key) { boardsBuilt = key;
      const which = watching ? [0, 1] : [mySeat];
      stage.innerHTML = '<div class="boards ' + (which.length === 2 ? 'two' : '') + '">' + which.map((i) => '<div class="bwrap b' + i + '" id="bw' + i + '"><div class="bhead"><span class="grow">' + (watching ? esc(S.names[i]) + "'s board" : 'Your board') + ' <span class="cnt" id="cnt' + i + '"></span></span>' + (!watching ? '<span class="mine">' + SVG[S.secrets[i]] + '<span>You are<br><b>' + esc(PBY[S.secrets[i]].name) + '</b></span></span>' : '<span class="mine" title="Their secret person">' + SVG[S.secrets[i]] + '<span>Secret:<br><b>' + esc(label(PBY[S.secrets[i]])) + '</b></span></span>') + '</div><div class="grid ' + (watching ? 'ro' : '') + '" id="g' + i + '">' + PEOPLE.map((p) => cardHTML(p, i, !watching)).join('') + '</div></div>').join('') + '</div>';
    }
    [0, 1].forEach((i) => { const g = $('g' + i); if (!g) return; const f = S.flips[i];
      g.querySelectorAll('.card').forEach((c) => { const id = c.dataset.id; c.classList.toggle('down', f.includes(id)); c.classList.toggle('secret', watching && S.secrets[1 - i] === id); c.classList.toggle('picked', S.phase === 'over' && S.lastGuess && S.lastGuess.s === i && S.lastGuess.id === id); c.disabled = watching || S.phase !== 'play'; });
      g.classList.toggle('guessing', !watching && guessMode && S.phase === 'play');
      const cnt = $('cnt' + i); if (cnt) cnt.textContent = '· ' + (PEOPLE.length - f.length) + ' still standing'; });
  }
  // status + controls
  const st = $('status'), ctl = $('controls'); let sHTML = '', cHTML = '';
  const tn = S.names[S.turn], on = S.names[1 - S.turn];

  else if (S.phase === 'over') { sHTML = esc(S.names[S.winner]) + ' wins!'; if (!watching) cHTML = '<div class="acts"><button class="btn" data-again type="button">Play again</button><button class="btn ghost" data-stand type="button">Let someone else play</button></div>'; }
  else if (watching) {
    sHTML = S.step === 'ask' ? esc(tn) + ' is thinking of a question...' : S.step === 'answer' ? esc(tn) + ' asked:<span class="q">' + esc(S.q) + '</span><small style="color:var(--mut)">Waiting for ' + esc(on) + ' to answer</small>' : esc(tn) + ' is flipping down cards.';
  } else if (mySeat === S.turn) {
    if (S.step === 'ask') { sHTML = guessMode ? 'Tap the person you think it is. A wrong guess loses the game.' : 'Your turn. Ask a yes or no question, or make a guess.';
      cHTML = guessMode ? '<div class="acts"><button class="btn ghost" data-guessoff type="button">Cancel guess</button></div>' : '<div class="hrow"><input type="text" id="qin" maxlength="140" placeholder="Is your person wearing glasses?" aria-label="Your question"><button class="btn" data-ask type="button">Ask</button></div><div class="chips">' + CHIPS.map((c) => '<button class="chip" type="button" data-chip>' + esc(c) + '</button>').join('') + '</div><div class="acts"><button class="btn ghost" data-guesson type="button">Make a guess</button></div>'; }
    else if (S.step === 'answer') sHTML = 'You asked:<span class="q">' + esc(S.q) + '</span><small style="color:var(--mut)">Waiting for ' + esc(on) + ' to answer...</small>';
    else { const last = [...S.log].reverse().find((l) => l.k === 'a'); sHTML = esc(on) + ' said <b class="' + (last ? last.v : '') + '" style="color:var(--' + (last && last.v === 'yes' ? 'good' : last && last.v === 'no' ? 'bad' : 'mut') + ')">' + (last ? ANS[last.v] : '') + '</b> to "' + esc(S.q) + '". Tap cards to flip down everyone it rules out.';
      cHTML = guessMode ? '<div class="acts"><button class="btn ghost" data-guessoff type="button">Cancel guess</button></div>' : '<div class="acts"><button class="btn" data-end type="button">Done, end my turn</button><button class="btn ghost" data-guesson type="button">Make a guess</button></div>'; }
  } else {
    if (S.step === 'answer') { sHTML = esc(tn) + ' asks:<span class="q">' + esc(S.q) + '</span><small style="color:var(--mut)">Answer for <b>' + esc(PBY[S.secrets[mySeat]].name) + '</b>, your secret person.</small>';
      cHTML = '<div class="acts"><button class="btn good" data-ans="yes" type="button">Yes</button><button class="btn bad" data-ans="no" type="button">No</button><button class="btn ghost" data-ans="maybe" type="button">Not sure</button></div>'; }
    else sHTML = S.step === 'ask' ? esc(tn) + ' is thinking of a question...' : esc(tn) + ' is flipping cards. You can flip yours any time.';
  }
  st.innerHTML = sHTML; if (ctl.dataset.html !== cHTML) { ctl.innerHTML = cHTML; ctl.dataset.html = cHTML; const qi = $('qin'); if (qi) qi.focus({ preventScroll: true }); }
  // log
  if (lastLog !== S.log.length + ':' + S.v) { const L = $('log'), atBottom = L.scrollHeight - L.scrollTop - L.clientHeight < 40; lastLog = S.log.length + ':' + S.v;
    L.innerHTML = S.log.map(logHTML).join(''); if (atBottom || true) L.scrollTop = L.scrollHeight; }
  // watchers
  const w = S.people.filter((p) => !S.seats.includes(p.id)).map((p) => esc(p.name) + (p.id === ME.id ? ' (you)' : ''));
  $('watchers').textContent = ''; $('watchers').innerHTML = w.length ? 'Watching: ' + w.join(', ') : 'Nobody watching yet.';
  // game over overlay
  const overKey = S.phase === 'over' ? S.v + ':' + S.winner : '';
  if (S.phase === 'over' && lastOver !== S.secrets.join() + S.score.join()) { lastOver = S.secrets.join() + S.score.join(); gameOver(mySeat); }
  if (S.phase !== 'over') { $('overlay').innerHTML = ''; lastOver = S.phase === 'play' ? '' : lastOver; }
}
const ANS = { yes: 'YES', no: 'NO', maybe: 'NOT SURE' };
function cardHTML(p, board, live) { return '<button class="card" type="button" data-id="' + p.id + '" aria-label="' + esc(p.name) + '"' + (live ? '' : ' tabindex="-1"') + '><span class="in"><span class="fr">' + SVG[p.id] + '<span>' + esc(label(p)) + '</span></span><span class="bk">' + esc(label(p)) + '</span></span></button>'; }
function logHTML(l) {
  const who = (s) => '<b class="c' + s + '">' + esc(S.names[s] || '') + '</b>';
  if (l.k === 'sys') return '<div class="sys">' + esc(l.text) + '</div>';
  if (l.k === 'q') return '<div class="q">' + who(l.s) + ': ' + esc(l.text) + '</div>';
  if (l.k === 'a') return '<div>' + who(l.s) + ': <span class="a ' + l.v + '">' + ANS[l.v] + '</span></div>';
  if (l.k === 'g') return '<div class="gw">' + who(l.s) + ' guessed ' + esc(PBY[l.id].name) + '... ' + (l.right ? 'correct!' : 'wrong!') + '</div>';
  if (l.k === 'c') return '<div>' + (l.s >= 0 ? '<b class="c' + l.s + '">' : '<b>') + esc(l.name) + '</b> ' + esc(l.text) + '</div>';
  return '';
}
function gameOver(mySeat) {
  const g = S.lastGuess, w = S.winner, me = mySeat === w;
  const head = mySeat < 0 ? esc(S.names[w]) + ' wins!' : me ? 'You win!' : 'You lose';
  const why = g.right ? esc(S.names[g.s]) + ' guessed ' + esc(PBY[g.id].name) + ' correctly.' : esc(S.names[g.s]) + ' guessed ' + esc(PBY[g.id].name) + ', but it was ' + esc(PBY[S.secrets[1 - g.s]].name) + '.';
  $('overlay').innerHTML = '<div class="over" data-close><div class="overcard" role="dialog" aria-label="Game over"><h2>' + head + '</h2><p>' + why + '</p><div class="reveal">' + [0, 1].map((i) => '<div>' + SVG[S.secrets[i]] + '<small>' + esc(S.names[i]) + ' was</small><b>' + esc(PBY[S.secrets[i]].name) + '</b></div>').join('') + '</div><p style="color:var(--mut)">Score: ' + esc(S.names[0]) + ' ' + S.score[0] + ', ' + esc(S.names[1]) + ' ' + S.score[1] + '</p><div class="acts" style="justify-content:center">' + (mySeat >= 0 ? '<button class="btn" data-again type="button">Play again</button>' : '') + '<button class="btn ghost" data-close type="button">Close</button></div></div></div>';
  if (g.right) confetti();
}
function confetti() { const cols = ['#D9433B', '#2F6DB5', '#FFC93C', '#2E9A5E', '#C77DFF']; for (let i = 0; i < 80; i++) { const d = document.createElement('i'); d.className = 'conf'; d.style.left = Math.random() * 100 + 'vw'; d.style.background = cols[i % 5]; d.style.animationDuration = 2 + Math.random() * 2.5 + 's'; d.style.animationDelay = Math.random() * 0.8 + 's'; document.body.appendChild(d); setTimeout(() => d.remove(), 6000); } }
function floatEmoji(e) { const d = document.createElement('div'); d.className = 'float'; d.textContent = e; d.style.left = 10 + Math.random() * 80 + 'vw'; document.body.appendChild(d); setTimeout(() => d.remove(), 2300); }
function toast(t) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); }
let guessMode = false;

// ---------------------------------------------------------------- input
document.addEventListener('click', (e) => {
  const t = e.target.closest('button'); if (!t) { if (e.target.matches('.over')) $('overlay').innerHTML = ''; return; }
  if (t.dataset.sit !== undefined) toHost({ t: 'sit', seat: +t.dataset.sit });
  else if (t.hasAttribute('data-stand')) { guessMode = false; toHost({ t: 'stand' }); }
  else if (t.hasAttribute('data-start')) toHost({ t: 'start' });
  else if (t.hasAttribute('data-swap')) toHost({ t: 'swap' });
  else if (t.hasAttribute('data-again')) { guessMode = false; $('overlay').innerHTML = ''; toHost({ t: 'again' }); }
  else if (t.hasAttribute('data-close')) $('overlay').innerHTML = '';
  else if (t.hasAttribute('data-chip')) { const q = $('qin'); if (q) { q.value = t.textContent; q.focus(); } }
  else if (t.hasAttribute('data-ask')) ask();
  else if (t.dataset.ans) toHost({ t: 'answer', v: t.dataset.ans });
  else if (t.hasAttribute('data-end')) toHost({ t: 'end' });
  else if (t.hasAttribute('data-guesson')) { guessMode = true; render(); }
  else if (t.hasAttribute('data-guessoff')) { guessMode = false; render(); }
  else if (t.classList.contains('card') && !t.disabled && S && S.phase === 'play') {
    const id = t.dataset.id, mySeat = S.seats.indexOf(ME.id);
    if (guessMode) { if (t.classList.contains('down')) { toast('That card is flipped down. Pick someone still standing.'); return; } if (confirm('Final guess: ' + PBY[id].name + '? If you are wrong, you lose.')) { guessMode = false; toHost({ t: 'guess', id }); } }
    else if (mySeat >= 0) { t.classList.toggle('down'); toHost({ t: 'flip', id }); }
  }
  else if (t.id === 'send') sendChat();
  else if (t.dataset.react) toHost({ t: 'react', e: t.dataset.react });
});
function ask() { const q = $('qin'); if (!q || !q.value.trim()) { q && q.focus(); return; } toHost({ t: 'ask', text: q.value.trim() }); }
function sendChat() { const c = $('chat'); if (!c.value.trim()) return; toHost({ t: 'chat', text: c.value }); c.value = ''; }
document.addEventListener('keydown', (e) => { if (e.key !== 'Enter') return; if (e.target.id === 'qin') ask(); if (e.target.id === 'chat') sendChat(); if (e.target.id === 'code') $('join').click(); if (e.target.id === 'nm') (QS.get('room') ? $('join') : $('create')).click(); });
$('reacts').innerHTML = REACTS.map((r) => '<button type="button" data-react="' + r + '" aria-label="React ' + r + '">' + r + '</button>').join('');

// ---------------------------------------------------------------- home
$('strip').innerHTML = ['noor', 'farhan', 'iqra', 'jaffar', 'alex', 'chomsky', 'musa', 'amna', 'saka', 'mobin'].map((id) => SVG[id]).join('');
$('nm').value = ME.name; if (QS.get('room')) { $('code').value = QS.get('room').toUpperCase(); $('join').textContent = 'Join room'; }
function needName() { const v = $('nm').value.trim(); if (!v) { $('h-err').textContent = 'Type your name first.'; $('nm').focus(); return false; } ME.name = v.slice(0, 16); try { localStorage.setItem('gw-name', ME.name); } catch (_) {} $('h-err').textContent = ''; return true; }
$('create').addEventListener('click', async () => { if (!needName()) return; $('h-err').textContent = 'Opening a room...'; try { await hostRoom(); $('h-err').textContent = ''; history.replaceState(null, '', '?room=' + N.code + (LOCAL ? '&local' : '')); show('room'); render(); } catch (e) { N.role = null; S = null; $('h-err').textContent = 'Could not open an online room (' + (e.type || e.message || 'network') + '). Check your internet and try again.'; } });
$('join').addEventListener('click', async () => { if (!needName()) return; const c = $('code').value.trim(); if (c.length !== 4) { $('h-err').textContent = 'Room codes have 4 letters.'; return; } $('h-err').textContent = 'Joining ' + c.toUpperCase() + '...'; try { await joinRoom(c); $('h-err').textContent = 'Connected, loading the room...'; history.replaceState(null, '', '?room=' + N.code + (LOCAL ? '&local' : '')); } catch (e) { N.role = null; $('h-err').textContent = 'Could not join ' + c.toUpperCase() + '. Check the code, or ask for a new link.'; } });
$('r-copy').addEventListener('click', async () => { const u = new URL(location.href); u.search = '?room=' + N.code + (LOCAL ? '&local' : ''); try { await navigator.clipboard.writeText(u.toString()); toast('Invite link copied'); } catch (_) { prompt('Copy this link:', u.toString()); } });
$('r-leave').addEventListener('click', () => { if (N.role === 'host' && S && S.people.length > 1 && !confirm('You made this room. If you leave, it closes for everyone. Leave?')) return; if (N.role === 'host') bcast({ t: 'closed' }); leaveRoom(); });

show('home');
